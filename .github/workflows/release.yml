# Publishes a GitHub release whenever the version in ToastyBuffs.toc changes.
#
# Push a commit that bumps "## Version: X.Y.Z" in ToastyBuffs.toc (and adds the
# "## X.Y.Z (date)" section to CHANGELOG.md): this workflow then
#   1. skips if release vX.Y.Z already exists,
#   2. zips the addon as ToastyBuffs/ (git archive: files marked export-ignore in
#      .gitattributes, like .github and CLAUDE.md, are left out),
#   3. creates tag and release vX.Y.Z with ToastyBuffs-vX.Y.Z.zip attached and
#      that version's CHANGELOG section as the notes.
#   4. uploads the same zip to CurseForge (Forever, game version 1.60.1)
#      once it's set up: the CF_API_KEY repository secret, and
#      "## X-Curse-Project-ID: <id>" in ToastyBuffs.toc. Until then it skips.
# WoWUp installs from the latest release's zip.
# Run it by hand from the Actions tab (Run workflow) to release the current
# version again after a failure; tick "Upload to CurseForge" to send the
# current version to CurseForge even if its GitHub release exists.
name: Release

on:
  push:
    branches: [main]
    paths: [ToastyBuffs.toc]
  workflow_dispatch:
    inputs:
      curseforge:
        description: Upload the current version to CurseForge even if its GitHub release exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from ToastyBuffs.toc
        id: v
        run: |
          v=$(sed -n 's/^## Version:[[:space:]]*//p' ToastyBuffs.toc | tr -d '\r[:space:]')
          if [ -z "$v" ]; then echo "No '## Version:' line in ToastyBuffs.toc" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.check.outputs.exists == 'false' || inputs.curseforge
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist/ToastyBuffs
          git archive HEAD | tar -x -C dist/ToastyBuffs
          (cd dist && zip -qr "ToastyBuffs-v$V.zip" ToastyBuffs)
          unzip -l "dist/ToastyBuffs-v$V.zip"

      - name: Write the release notes
        if: steps.check.outputs.exists == 'false' || inputs.curseforge
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # This version's CHANGELOG section, without its heading.
          awk -v v="$V" '
            $0 ~ "^## " v "([[:space:]]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "Toasty Buffs v$V" > notes.md; fi
          cat >> notes.md <<NOTES

          ### Install
          Extract the \`ToastyBuffs\` folder from \`ToastyBuffs-v$V.zip\` into \`World of Warcraft\\_forever_\\Interface\\AddOns\\\` (copy it; don't symlink it), then restart the game or \`/reload\`. Or install from this repository in WoWUp.
          NOTES
          sed -i 's/^          //' notes.md
          cat notes.md

      - name: Create the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$V" "dist/ToastyBuffs-v$V.zip" \
            --title "Toasty Buffs v$V" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Upload to CurseForge
        if: steps.check.outputs.exists == 'false' || inputs.curseforge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          V: ${{ steps.v.outputs.version }}
          CF_GAME_VERSION: "1.60.1"
        run: |
          pid=$(sed -n 's/^## X-Curse-Project-ID:[[:space:]]*//p' ToastyBuffs.toc | tr -d '\r[:space:]')
          if [ -z "$CF_API_KEY" ] || [ -z "$pid" ]; then
            echo "CurseForge isn't set up yet (needs the CF_API_KEY secret and X-Curse-Project-ID in ToastyBuffs.toc). Skipping."
            exit 0
          fi
          api=https://wow.curseforge.com/api
          curl -sSf -H "X-Api-Token: $CF_API_KEY" "$api/game/version-types" > types.json
          curl -sSf -H "X-Api-Token: $CF_API_KEY" "$api/game/versions" > versions.json
          # The game version named 1.60.1, in a Forever version type when there is one.
          ids=$(jq -c --arg n "$CF_GAME_VERSION" --slurpfile types types.json '
            ($types[0] | map(select(.name | test("forever"; "i")) | .id)) as $fv
            | [ .[] | select(.name == $n)
                    | select(($fv | length) == 0 or (.gameVersionTypeID as $t | $fv | index($t))) | .id ]
          ' versions.json)
          if [ "$ids" = "[]" ]; then
            echo "No CurseForge game version named $CF_GAME_VERSION. Version types:" >&2
            jq -r '.[] | "\(.id) \(.name)"' types.json >&2
            exit 1
          fi
          echo "Game versions: $ids"
          jq -n --rawfile cl notes.md --arg dn "Toasty Buffs v$V" --argjson gv "$ids" \
            '{changelog: $cl, changelogType: "markdown", displayName: $dn, gameVersions: $gv, releaseType: "release"}' > meta.json
          curl -sSf -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<meta.json" \
            -F "file=@dist/ToastyBuffs-v$V.zip" \
            "$api/projects/$pid/upload-file"
          echo
          echo "Uploaded Toasty v$V to CurseForge project $pid."
